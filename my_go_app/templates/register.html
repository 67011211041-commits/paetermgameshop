<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก - GameTopup Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-indigo-500">🎮 GAMING TOPUP</h1>
            <p class="text-slate-400 text-sm mt-1">สร้างบัญชีผู้ใช้ใหม่</p>
        </div>
        <form action="/register" method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Username</label>
                <input type="text" name="username" required placeholder="ตั้งชื่อผู้ใช้"
                    class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Password</label>
                <input type="password" name="password" required placeholder="ตั้งรหัสผ่าน"
                    class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500">
            </div>
            <button type="submit" 
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg shadow-lg shadow-emerald-600/30 transition">
                ยืนยันการสมัครสมาชิก
            </button>
        </form>
        <p class="text-center text-slate-400 text-sm mt-6">
            มีบัญชีอยู่แล้ว? <a href="/login" class="text-indigo-400 hover:underline">เข้าสู่ระบบ</a>
        </p>
    </div>
</body>
</html>
